<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>திருவிவிலியம் | Bible in Tamil</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="backBtn" class="icon-btn" aria-label="பின்">‹</button>
    <div id="titleWrap"><h1 id="pageTitle">திருவிவிலியம்</h1><p id="pageSub">Bible in Tamil</p></div>
    <button id="fontBtn" class="icon-btn" aria-label="எழுத்து அளவு">அ</button>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <button data-route="home" class="tab"><span class="ti">⌂</span><span>முகப்பு</span></button>
    <button data-route="bible" class="tab"><span class="ti">✦</span><span>விவிலியம்</span></button>
    <button data-route="compare" class="tab"><span class="ti">◐</span><span>ஒப்பிடுக</span></button>
    <button data-route="search" class="tab"><span class="ti">⌕</span><span>தேடுக</span></button>
    <button data-route="more" class="tab"><span class="ti">☰</span><span>மேலும்</span></button>
  </nav>

  <div id="fontSheet" class="sheet hidden">
    <div class="sheet-card">
      <p>எழுத்து அளவு</p>
      <div class="font-row">
        <button data-fs="15">சிறியது</button>
        <button data-fs="18" class="on">நடுத்தரம்</button>
        <button data-fs="22">பெரியது</button>
        <button data-fs="26">மிகப்பெரியது</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
